name: WorkClub CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: MongoDB integration and coverage gate
        run: npm run test:coverage --workspace backend
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/workclub-integration
          USE_IN_MEMORY_MONGO: "false"

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Seed E2E workspace
        run: npm run seed:demo
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/workclub-e2e
          JWT_SECRET: e2e-secret-that-is-longer-than-thirty-two-characters
          COOKIE_SECURE: "false"
          REQUIRE_EMAIL_VERIFICATION: "false"
          QUEUE_MODE: inline
          LOG_LEVEL: silent
          USE_IN_MEMORY_MONGO: "false"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e -- --project=chromium
        env:
          E2E_MONGO_URI: mongodb://127.0.0.1:27017/workclub-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
